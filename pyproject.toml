[project]
name = "qarzly"
version = "1.0.0"
description = "Qarz Daftar — Telegram qarz hisob boti (Aiogram 3.x, Clean Architecture, Mini App)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.10.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
