[project]
name = "qarzly"
version = "1.0.0"
description = "Qarz Daftar — Telegram qarz hisob boti (Aiogram 3.x, Clean Architecture, Supabase PostgreSQL, Mini App)"
requires-python = ">=3.11"
dependencies = [
    "aiogram~=3.10",
    "asyncpg~=0.30",
    "apscheduler~=3.10",
    "aiohttp~=3.9",
    "pydantic~=2.7",
    "pydantic-settings~=2.3",
    "python-dotenv~=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.23",
    "ruff~=0.5",
    "mypy~=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: haqiqiy PostgreSQL talab qiladi (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
