services:
  - type: web
    name: qarzly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: qarzly
          property: host
      - key: LOG_LEVEL
        value: INFO
